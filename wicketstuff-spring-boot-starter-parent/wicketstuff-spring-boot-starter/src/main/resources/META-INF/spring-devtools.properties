# Loads Wicket and wicketstuff jars (including this starter) in Spring Boot DevTools' restart
# classloader instead of its base classloader.
#
# Wicket deserializes pages from its page store with an ObjectInputStream that resolves classes
# through the nearest application classloader on the call stack. With Wicket in the base
# classloader, that resolves the application's page classes from the base classloader too, while
# @SpringBean proxies are rebuilt for the restart classloader's classes: restoring a stored page
# (the back button, or any page after a restart) then fails with a ClassCastException.
#
# Every jar that references Wicket types has to move together, or the two classloaders mismatch
# the other way round.
restart.include.wicket=/wicket-[\\w\\d-\\.]+\\.jar
restart.include.wicketstuff=/wicketstuff-[\\w\\d-\\.]+\\.jar
