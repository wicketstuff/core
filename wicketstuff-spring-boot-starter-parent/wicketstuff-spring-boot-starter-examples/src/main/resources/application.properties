# None of these are required -- the starter works with no configuration at all. They are set here
# to show that externalised wicket.* properties reach Wicket, and are asserted by
# WicketPropertiesBindingTest.
#
# DEVELOPMENT is Wicket's default and enables its development-time checks; switch to DEPLOYMENT in
# production, typically via a Spring profile.
wicket.configuration=DEVELOPMENT
# /* is also the default; shown here to make the mapping explicit.
wicket.filter-path=/*
wicket.filter-name=wicket-example-filter

# Disable banner for cleaner startup logs
spring.main.banner-mode=off
