<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8" />
    <title>Wicket Spring Boot Example</title>
    <style>
        body { font-family: sans-serif; background-color: #f7f9fc; margin: 40px; }
        .container { background-color: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { color: #d14; }
        .service-msg { font-style: italic; color: #555; background: #eee; padding: 10px; border-left: 4px solid #d14; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wicket Starter Example</h1>
        <div wicket:id="message">Message goes here.</div>
        <div wicket:id="springMessage" class="service-msg">Spring service message goes here.</div>
    </div>
</body>
</html>
