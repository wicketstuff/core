name: Feature request
description: An improvement or a new feature for a Wicket Stuff module.
labels: [improvement]
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: The artifact id, for example wicketstuff-select2. Leave it empty for a new module or a change to the whole project.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What do you propose?
    validations:
      required: true
  - type: checkboxes
    id: pull-request
    attributes:
      label: Pull request
      options:
        - label: I plan to send a pull request
