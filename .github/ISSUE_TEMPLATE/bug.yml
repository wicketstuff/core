name: Bug report
description: Something in a Wicket Stuff module doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: The artifact id, for example wicketstuff-select2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wicket Stuff version
      placeholder: "10.12.0"
    validations:
      required: true
  - type: dropdown
    id: wicket
    attributes:
      label: Wicket line
      options: ["11.x", "10.x (LTS)", "older"]
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "21"
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, a code snippet, or a link to a quickstart project.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Stack trace or log output
      render: shell
